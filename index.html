        const x = bloqueo.get(); if (!x) return;
        if (x.cred) { bloqueo.set({ ...x, cred: null }); toast('Face ID desactivado'); return rerender(); }
        try { bloqueo.set({ ...x, cred: await crearFaceID() }); toast('🙂 Face ID activado'); } catch (e) { toast('No se pudo activar Face ID'); }
        rerender();
      };
    }
  });
  return `<section class="card"><h2>🔒 Bloqueo de la app</h2>
    <div class="small muted">${b ? `Activado en este teléfono${b.cred ? ' con PIN y Face ID' : ' con PIN'}. Se bloquea al abrir la app y si la dejas más de 1 minuto.` : 'Pide un PIN (o Face ID) para abrir la app. Útil si prestas tu teléfono o lo pierdes.'}</div>
    <div class="btns">${b ? `<button class="btn" id="bFace">${b.cred ? 'Quitar Face ID' : '🙂 Usar Face ID'}</button><button class="btn" id="bCambiar">Cambiar PIN</button><button class="btn danger" id="bOff">Quitar bloqueo</button>` : '<button class="btn pri" id="bOn">Activar bloqueo</button>'}</div></section>`;
}

/* =================== Respaldo y Excel =================== */
function respaldo() { return { version: 2, fecha: hoy(), config: C(), movs: D.movs, pasivos: D.pas, activos: D.act, msi: D.msi }; }
async function descargar(nombre, blob) {
  if (descargas) { try { await descargas.save({ filename: nombre, data: blob }); } catch (e) { if (e && e.code !== 'declined') toast('No se pudo descargar'); } return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
function cargarScript(src) { return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
async function excel() {
  if (!window.ExcelJS) await cargarScript('exceljs.min.js');
  const c = C(), R = calc(hoy().slice(0, 7)), wb = new ExcelJS.Workbook(); wb.creator = 'Mis Finanzas';
  const NAVY = 'FF0F766E', F = { name: 'Arial', size: 10 }, M = '$#,##0;-$#,##0;"-"', P = '0.0%', DF = 'dd-mmm-yy';
  const toD = s => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
  const ln = { style: 'thin', color: { argb: 'FFBFBFBF' } }, box = { top: ln, bottom: ln, left: ln, right: ln };
  const hoja = (n, w) => { const ws = wb.addWorksheet(n, { views: [{ showGridLines: false }] }); ws.columns = w.map(x => ({ width: x })); ws._r = 1; return ws; };
  const titulo = (ws, t, s) => { const r = ws.getRow(ws._r++); r.getCell(1).value = t; r.getCell(1).font = { name: 'Arial', size: 15, bold: true, color: { argb: NAVY } }; if (s) { const r2_ = ws.getRow(ws._r++); r2_.getCell(1).value = s; r2_.getCell(1).font = { ...F, italic: true, color: { argb: 'FF595959' } }; } ws._r++; };
  const tabla = (ws, heads, rows, fmts, tot) => {
    const h = ws.getRow(ws._r++); heads.forEach((t, k) => { const cl = h.getCell(k + 1); cl.value = t; cl.font = { ...F, bold: true, color: { argb: 'FFFFFFFF' } }; cl.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: NAVY } }; cl.border = box; cl.alignment = { wrapText: true, vertical: 'middle' }; });
    rows.forEach((row, ri) => { const r = ws.getRow(ws._r++); row.forEach((v, k) => { const cl = r.getCell(k + 1); cl.value = v; cl.font = { ...F, bold: !!(tot && ri === rows.length - 1) }; cl.border = box; if (fmts[k]) cl.numFmt = fmts[k]; }); });
    ws._r++;
  };
  let ws = hoja('Resumen', [42, 16, 16, 16, 12]);
  titulo(ws, 'Mis Finanzas · Resumen', `${mesNombre(hoy().slice(0, 7))} · generado ${fDateY(hoy())}`);
  tabla(ws, ['Concepto', 'Monto'], [['Ingresos del mes', R.ing], ['Gastos fijos', R.g.fijo], ['Gastos variables', R.g.variable], ['Gastos hormiga', R.g.hormiga], ['Ahorro e inversión', R.aho], ['Disponible', R.libre], ['Activos', R.totA], ['Deuda de tarjetas', R.totP], ['Patrimonio neto', R.pn], ['Interés mensual estimado', R.interes]], [null, M]);
  tabla(ws, ['Indicador', 'Valor', 'Sano', 'Estado'], c.umbrales.map(u => { const v = R.ind[u.id] ?? 0; return [u.nombre, fmtInd(u.fmt, v), fmtInd(u.fmt, +u.sano), ESTADO[estado(u, v)][0]]; }), [null, null, null, null]);
  tabla(ws, ['Categoría', 'Tipo', 'Presupuesto', 'Real', '% usado'], R.cats.filter(k => k.pres || k.real).map(k => [k.nombre, CLASES[k.clase || 'variable'].u, k.pres, k.real, k.pres ? k.real / k.pres : null]), [null, null, M, M, P]);
  ws = hoja('Movimientos', [13, 12, 12, 24, 14, 20, 40]);
  titulo(ws, 'Movimientos', 'Todos los registros');
  const tjN = id => (c.tarjetas.find(t => t.id === id) || {}).nombre || '';
  tabla(ws, ['Fecha', 'Tipo', 'Clase', 'Categoría', 'Monto', 'Pagado con', 'Nota'], [...D.movs].sort((a, b) => b.fecha.localeCompare(a.fecha)).map(m => [toD(m.fecha), m.tipo, m.tipo === 'Gasto' ? CLASES[claseDe(m)].u : '', m.cat, +m.monto, m.pago ? tjN(m.pago) : '', m.nota || '']), [DF, null, null, null, M, null, null]);
  ws = hoja('Tarjetas', [10, 26, 15, 18, 15, 10, 14, 14]);
  titulo(ws, 'Tarjetas de crédito', 'Prioridad avalancha: tasa más alta primero');
  tabla(ws, ['Prioridad', 'Tarjeta', 'Saldo', 'Para no generar intereses', 'MSI restante', 'Tasa', 'Interés/mes', 'Fecha límite'], [...R.cards].sort((a, b) => (a.prio || 99) - (b.prio || 99)).map(t => [t.prio || '—', t.nombre, t.saldo, t.pagar, t.msiR, +t.tasa || 0, t.interes, toD(t.due)]).concat([['', 'Total', R.totP, sum(R.cards, x => x.pagar), sum(R.cards, x => x.msiR), R.costo, R.interes, null]]), [null, null, M, M, M, P, M, DF], true);
  if (D.msi.length) tabla(ws, ['Compra a MSI', 'Tarjeta', 'Total', 'Meses', 'Mensualidad', 'Pagadas', 'Restante'], D.msi.map(x => [x.nota || x.cat, tjN(x.tarjetaId), +x.total, +x.meses, msiMens(x), msiCuotas(x, hoy().slice(0, 7)), msiRestante(x, hoy().slice(0, 7))]), [null, null, M, null, M, null, M]);
  ws = hoja('Ahorros y metas', [30, 22, 16, 16, 12, 16]);
  titulo(ws, 'Ahorros, inversiones y metas');
  tabla(ws, ['Cuenta', 'Tipo', 'Saldo', '% del total'], R.ctas.map(a => [a.nombre, a.clase, a.saldo, a.share]).concat([['Total', '', R.totA, 1]]), [null, null, M, P], true);
  tabla(ws, ['Meta', 'Cuenta', 'Objetivo', 'Actual', 'Avance', 'Aportar/mes'], c.metas.map(m => { const a = R.ctas.find(x => x.id === m.cuentaId), o = metaObjetivo(m), act = a ? a.saldo : 0, f = Math.max(0, o - act); return [m.nombre, a ? a.nombre : '', o, act, o ? Math.min(1, act / o) : 0, m.fecha && f ? f / mesesHasta(m.fecha) : 0]; }), [null, null, M, M, P, M]);
  ws = hoja('Evolución', [12, 16, 16, 16, 16, 16]);
  titulo(ws, 'Evolución mensual');
  tabla(ws, ['Mes', 'Activos', 'Deuda', 'Patrimonio', 'Ingresos', 'Gastos'], historia().map(r => [mesCorto(r.ym), r.a, r.p, r.a - r.p, r.i, r.g]), [null, M, M, M, M, M]);
  const buf = await wb.xlsx.writeBuffer();
  await descargar(`Mis_Finanzas_${hoy()}.xlsx`, new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
}
async function restaurar(d) {
  [...D.movs.map(x => 'movs/' + x.id), ...D.pas.map(x => 'pasivos/' + x.id), ...D.act.map(x => 'activos/' + x.id), ...D.msi.map(x => 'msi/' + x.id)].forEach(p => put(p, null));
  (d.msi || []).forEach(x => put('msi/' + (x.id || uid()), x));
  (d.movs || []).forEach(x => put('movs/' + (x.id || uid()), x));
  (d.pasivos || []).forEach(x => put('pasivos/' + (x.id || uid()), x));
  (d.activos || []).forEach(x => put('activos/' + (x.id || uid()), x));
  await guardarCfg({ ...(d.config || {}), migradoV1: true });
}

/* =================== Eventos =================== */
function irA(t) {
  if (t === 'ahorros' || t === 'cuentas') { subA = 'cuentas'; t = 'analisis'; } else if (t === 'tarjetas') { subA = 'tarjetas'; t = 'analisis'; } else if (t === 'resumen') { subA = 'resumen'; t = 'analisis'; }
  tab = t; if (t !== 'ajustes') borrador = null;
  const h = t === 'analisis' && subA !== 'resumen' ? subA : t;
  if (location.hash.slice(1) !== h) history.replaceState(null, '', '#' + h);
  render.forzar = true; render(); scrollTo(0, 0);
}
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) irA(b.dataset.tab); });
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if ((TITULOS[t] || ['cuentas', 'tarjetas', 'ahorros'].includes(t)) && t !== (tab === 'analisis' && subA !== 'resumen' ? subA : tab)) irA(t); });
$('#fab').onclick = () => abrirRegistro();
$('#btnCfg').onclick = () => irA(tab === 'ajustes' ? 'inicio' : 'ajustes');

const view = $('#view');
view.addEventListener('input', e => {
  if (['simPago', 'simExtra', 'simMes', 'simInv'].includes(e.target.id)) simRender(calc(hoy().slice(0, 7)));
});
view.addEventListener('change', async e => {
  if (e.target.id === 'cFile') {
    const file = e.target.files[0]; if (!file) return;
    let d; try { d = JSON.parse(await file.text()); } catch (err) { toast('Archivo de respaldo no válido'); return; }
    if (!Array.isArray(d.movs) || d.version !== 2) { toast('Ese archivo no es un respaldo de esta versión de Mis Finanzas'); return; }
    openSheet(`<h3>Restaurar respaldo<button class="x" aria-label="Cerrar">✕</button></h3>
      <div class="small">El respaldo del ${esc(fDateY(d.fecha || hoy()))} tiene <b>${d.movs.length}</b> movimientos. Tus datos actuales se reemplazarán por los del archivo.</div>
      <div class="btns"><button class="btn" id="rNo">Cancelar</button><button class="btn pri" id="rSi">Reemplazar mis datos</button></div>`);
    $('#rNo').onclick = closeSheet;
    $('#rSi').onclick = () => { closeSheet(); borrador = null; restaurar(d).then(() => { toast('Respaldo restaurado'); irA('inicio'); }); };
    return;
  }
  const pr = e.target.closest('[data-pres]');
  if (pr) { const c = cfgCopia(), k = c.categorias[+pr.dataset.pres]; if (!k) return; const q = c.params.periodo === 'quincenal', v = r2(num(pr.value) * (q ? 2 : 1)); if (v === (+k.presupuesto || 0)) return; k.presupuesto = v; guardarCfg(c); toast(`Presupuesto de ${k.nombre}: ${q ? fmt(v / 2) + ' por quincena' : fmt(v) + ' al mes'}`); return; }
  const el = e.target.closest('[data-cfg]'); if (!el || !borrador) return;
  let v = el.type === 'checkbox' ? el.checked : el.value;
  const path = el.dataset.cfg;
  if (path === 'params.ivaPct') { borrador.params.iva = num(v) / 100; return; }
  if (el.getAttribute('inputmode') === 'decimal') v = num(v);
  if (/^categorias\.\d+\.nombre$/.test(path)) { const i = +path.split('.')[1]; const viejo = borrador.categorias[i] && borrador.categorias[i].nombre; if (viejo) borrador._renombres = { ...(borrador._renombres || {}), [viejo]: v }; }
  setPath(borrador, path, v);
  if (/rentaUSD|tc$/.test(path)) rerender();
});
view.addEventListener('click', e => {
  const el = e.target.closest('button,[data-edit],[data-go],[data-sub],[data-filtro],[data-edittar],[data-editcta],[data-editmeta]');
  if (!el) return;
  const d = el.dataset;
  if (d.edit && d.edit.startsWith('msi:')) return editMSI(d.edit.split(':')[1]);
  if (d.edit) return openMov({ id: d.edit });
  if (d.editmsi) return editMSI(d.editmsi);
  if (d.go) return irA(d.go);
  if (d.sub) { subA = d.sub; return irA('analisis'); }
  if (d.filtro) { filtro = d.filtro; return rerender(); }
  if (d.mes) { mes = ymAdd(mes, +d.mes); return rerender(); }
  if (d.quin) { let q = quin + +d.quin; if (q < 1) { q = 2; mes = ymAdd(mes, -1); } else if (q > 2) { q = 1; mes = ymAdd(mes, 1); } quin = q; return rerender(); }
  if (d.periodo) { const c = cfgCopia(); if (c.params.periodo === d.periodo) return; c.params.periodo = d.periodo; mes = hoy().slice(0, 7); quin = quinDe(hoy()); guardarCfg(c); return toast(d.periodo === 'quincenal' ? '🗓️ Presupuesto por quincena (1–15 y 16–fin de mes)' : '📅 Presupuesto mensual'); }
  if (d.msinueva) return nuevaMSI(d.msinueva);
  if (d.tarfoto !== undefined) return leerEstado(d.tarfoto);
  if (d.tarpago) return pagoTarjeta(d.tarpago);
  if (d.tarsaldo) return saldoCorte(d.tarsaldo);
  if (d.edittar) return editTarjeta(d.edittar);
  if (d.editcta) return editCuenta(d.editcta);
  if (d.ctamov) return movCuenta(d.id, d.ctamov);
  if (d.editmeta) return editMeta(d.editmeta);
  if (d.delreg) { if (!el.classList.contains('armed')) { el.classList.add('armed'); el.textContent = '¿Borrar?'; setTimeout(() => { el.classList.remove('armed'); el.textContent = '✕'; }, 3000); return; } return put(d.delreg, null); }
  if (el.id === 'addTar') return editTarjeta();
  if (el.id === 'addCta') return editCuenta();
  if (el.id === 'addMeta') return editMeta();
  // Ajustes
  if (d.addcat && borrador) { borrador.categorias.push(d.addcat === 'Gasto' ? { nombre: 'Nueva categoría', tipo: 'Gasto', clase: 'variable', presupuesto: 0, recurrente: false } : { nombre: 'Nuevo ingreso', tipo: 'Ingreso' }); return rerender(); }
  if (d.rmcat && borrador) { borrador.categorias.splice(+d.rmcat, 1); return rerender(); }
  if (el.id === 'cfgCancel') { borrador = null; return irA('inicio'); }
  if (el.id === 'cfgSave') {
    const nombres = borrador.categorias.map(k => norm(k.nombre));
    if (nombres.some((n, i) => !n || nombres.indexOf(n) !== i)) { toast('Hay categorías vacías o repetidas'); return; }
    const ren = borrador._renombres || {}; delete borrador._renombres;
    // si renombraste una categoría, sus movimientos la siguen
    for (const [viejo, nuevo] of Object.entries(ren)) if (viejo && nuevo && viejo !== nuevo && !borrador.categorias.some(k => k.nombre === viejo)) D.movs.filter(m => m.cat === viejo && m.tipo !== 'Ahorro').forEach(m => put('movs/' + m.id, { ...m, cat: nuevo }));
    borrador.categorias.forEach(k => { if (k.tipo === 'Gasto') k.clase = k.clase || 'variable'; });
    borrador.retos = C().retos; borrador.sinGasto = C().sinGasto;
    guardarCfg(borrador); borrador = null; toast('Ajustes guardados'); return irA('inicio');
  }
  if (el.id === 'cExcel') { el.disabled = true; el.textContent = 'Preparando…'; excel().catch(() => toast('No se pudo generar el Excel')).finally(() => { el.disabled = false; el.textContent = '📗 Descargar Excel'; }); return; }
  if (el.id === 'cJson') return descargar(`mis-finanzas-respaldo-${hoy()}.json`, new Blob([JSON.stringify(respaldo(), null, 2)], { type: 'application/json' }));
  if (el.id === 'cImp') return $('#cFile').click();
  if (el.id === 'cDel') {
    if (!el.classList.contains('armed')) { el.classList.add('armed'); el.textContent = '¿Borrar TODO? Toca otra vez'; setTimeout(() => { el.classList.remove('armed'); el.textContent = 'Borrar todos mis datos'; }, 3500); return; }
    borrador = null; restaurar({ config: null }).then(() => { toast('Datos borrados'); irA('inicio'); }); return;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.pres !== undefined) { e.preventDefault(); e.target.blur(); return; }
  if (e.key === 'Escape' && !$('#sheetWrap').hidden) closeSheet();
  if (e.key.toLowerCase() === 'n' && $('#sheetWrap').hidden && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); abrirRegistro(); }
});
window.addEventListener('storage', e => { if (ST.modo === 'local' && e.key === LKEY) { cargarLocal(); refrescar(); } });

/* =================== Arranque =================== */
(function () { const t = location.hash.slice(1); if (TITULOS[t]) tab = t; else if (['cuentas', 'tarjetas', 'ahorros'].includes(t)) { tab = 'analisis'; subA = t === 'tarjetas' ? 'tarjetas' : 'cuentas'; } })();
iniciar().catch(() => { ST.cargado = true; refrescar(); });
prepararDictado().catch(() => {});
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
prepararIA().catch(() => {});
bloquear();
if (window.claude && claude.use) claude.use('downloads').then(d => { descargas = d; }).catch(() => {});
</script>
