<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Finanzas</title>
<meta name="description" content="Registra tus gastos, ingresos, ahorros y tarjetas en segundos.">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<style>
/* Layout: una columna tipo app móvil con barra inferior fija; tarjetas blancas sobre fondo gris verdoso. Hormiga = naranja, fijos = índigo, variables = fucsia, ingresos = verde, ahorro = azul, deuda = rojo. */
:root{
  --bg:#f3f5f3;--card:#fff;--ink:#1b1f1e;--muted:#66706c;--line:#e2e6e3;
  --pri:#0f766e;--pri-ink:#fff;--soft:#e2f1ee;
  --ant:#c2410c;--ant-soft:#fdeee4;
  --fix:#4f46e5;--fix-soft:#ecebfd;
  --var:#a21caf;--var-soft:#f8e8fb;
  --inc:#15803d;--inc-soft:#e3f3e8;
  --debt:#b91c1c;--debt-soft:#fde8e8;
  --warn:#a16207;--warn-soft:#fdf3d7;
  --sav:#0369a1;--sav-soft:#e2f0f9;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101413;--card:#1a1f1e;--ink:#eef1ef;--muted:#9aa39f;--line:#2a302e;
    --pri:#2dd4bf;--pri-ink:#062b27;--soft:#16302c;
    --ant:#fb923c;--ant-soft:#3a2216;--fix:#a5b4fc;--fix-soft:#25264a;
    --var:#e879f9;--var-soft:#3a1a3f;--inc:#4ade80;--inc-soft:#163222;
    --debt:#f87171;--debt-soft:#3b1a1a;--warn:#fbbf24;--warn-soft:#3a2e12;
    --sav:#7dd3fc;--sav-soft:#122c3b;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101413;--card:#1a1f1e;--ink:#eef1ef;--muted:#9aa39f;--line:#2a302e;
  --pri:#2dd4bf;--pri-ink:#062b27;--soft:#16302c;
  --ant:#fb923c;--ant-soft:#3a2216;--fix:#a5b4fc;--fix-soft:#25264a;
  --var:#e879f9;--var-soft:#3a1a3f;--inc:#4ade80;--inc-soft:#163222;
  --debt:#f87171;--debt-soft:#3b1a1a;--warn:#fbbf24;--warn-soft:#3a2e12;
  --sav:#7dd3fc;--sav-soft:#122c3b;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--font);padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg)}
.top h1{font-size:20px;margin:0;text-wrap:balance}
.icon-btn{border:0;background:var(--card);min-width:38px;height:38px;border-radius:12px;box-shadow:var(--shadow);font-size:17px;padding:0 10px}
main{max-width:720px;margin:0 auto;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--card);border-radius:18px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.amt,.num{font-variant-numeric:tabular-nums}
.amt{font-weight:700}
.hero .label{font-size:13px;color:var(--muted)}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin:2px 0 12px}
[hidden]{display:none!important}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stats.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(min-width:560px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stats.c3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stat{border-radius:12px;padding:8px 10px;min-width:0}
.stat .k{font-size:12px;opacity:.85}
.stat .v{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .s{font-size:11px;opacity:.8}
.s-inc{background:var(--inc-soft);color:var(--inc)}.s-fix{background:var(--fix-soft);color:var(--fix)}
.s-ant{background:var(--ant-soft);color:var(--ant)}.s-var{background:var(--var-soft);color:var(--var)}
.s-sav{background:var(--sav-soft);color:var(--sav)}.s-debt{background:var(--debt-soft);color:var(--debt)}
.s-warn{background:var(--warn-soft);color:var(--warn)}.s-neu{background:var(--bg);color:var(--ink)}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--line);margin-top:12px}
.bar i{display:block;height:100%}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend b{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
.quick button{border:0;border-radius:16px;padding:12px 4px;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--shadow)}
.quick span{font-size:22px}
.qbar{display:flex;gap:8px}
.qbar input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;outline:none}
.qbar input:focus{border-color:var(--pri)}
.mic{width:46px;flex:none;border-radius:12px;border:1px solid var(--pri);background:var(--card);color:var(--pri);font-size:19px}
.mic.on{background:var(--debt);border-color:var(--debt);color:#fff}
.preview{font-size:13px;margin-top:8px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child,.row.first{border-top:0}
.ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none}
.main{flex:1;min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.tap{cursor:pointer}
.pos{color:var(--inc)}.neg-c{color:var(--debt)}
.racha{background:var(--card);border-radius:14px;padding:10px 14px;margin:0 0 12px;box-shadow:var(--shadow);font-size:14px;min-width:0}
.racha .tiny{margin-top:2px}
.dinero{border-left:4px solid var(--debt)}
.regreso{border-left:4px solid var(--pri)}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:600;background:var(--soft);color:var(--pri)}
.btn.pri{background:var(--pri);color:var(--pri-ink)}
.btn.danger{background:var(--debt-soft);color:var(--debt)}
.btn.armed{background:var(--debt);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.block{width:100%;padding:14px;font-size:16px}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:14px}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.chips.scroll .chip{flex:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 4px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.amount-input{width:100%;border:0;background:transparent;text-align:center;font-size:42px;font-weight:800;padding:8px 0;outline:none;font-variant-numeric:tabular-nums}
.field{display:block;margin:12px 0 0;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.bRow+.bRow{border-top:1px dashed var(--line);margin-top:14px;padding-top:2px}
.sinSesion .tabs,.sinSesion #btnCfg,.sinSesion .top{display:none!important}
.acceso{max-width:420px;margin:0 auto}
.field>span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input,.field select,.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 11px;outline:none;min-width:0}
.field input:focus,.field select:focus,.inp:focus{border-color:var(--pri)}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbl{font-size:12px;color:var(--muted);margin:14px 0 6px;display:flex;align-items:center;gap:6px}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.monthnav b{font-size:16px}
.dayhead{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:14px 4px 4px}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.prog{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;border-radius:5px}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.alert{display:block;background:var(--debt-soft);border-left:5px solid var(--debt);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.alert.warn{background:var(--warn-soft);border-left-color:var(--warn)}
.alert b{color:var(--debt)}.alert.warn b{color:var(--warn)}
.scroll-x{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{font-size:11px;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.cfg td{white-space:normal}
.cfg .inp{padding:7px 8px;font-size:14px}
.chart{position:relative;height:240px}
.chart.sm{height:200px}
details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px}
.tile{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.tile.good{border-color:var(--inc);background:var(--inc-soft)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:var(--card);border-top:1px solid var(--line);padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:19px;color:var(--muted);padding:4px 0;min-width:0}
.tabs button span{font-size:10px;margin-top:2px;white-space:nowrap}
.tabs button.on{color:var(--pri)}.tabs button.on span{font-weight:700}
.tabs .fab{width:56px;height:56px;margin:-26px auto 0;border-radius:50%;background:var(--pri);color:var(--pri-ink);font-size:32px;line-height:1;box-shadow:0 6px 18px rgba(15,118,110,.4);justify-content:center}
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:540px;border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:92vh;overflow:auto;animation:up .18s ease-out}
@media(min-width:600px){.sheet-wrap{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(30px)}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h3{margin:0 0 12px;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{border:0;background:var(--bg);width:32px;height:32px;border-radius:50%;font-size:15px;flex:none}
#toast{position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;display:flex;gap:12px;align-items:center;z-index:30;max-width:calc(100vw - 32px)}
#toast button{border:0;background:none;color:var(--pri);font-weight:700;padding:0;flex:none}
.micbig{width:84px;height:84px;border-radius:50%;border:0;background:var(--pri);color:var(--pri-ink);font-size:36px;display:block;margin:4px auto 8px;box-shadow:0 6px 18px rgba(15,118,110,.35)}
.micbig.on{background:var(--debt);animation:pulso 1.2s infinite}
@keyframes pulso{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){.micbig.on{animation:none}}
.vtext{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;outline:none;resize:none;margin-top:10px}
.vtext:focus{border-color:var(--pri)}
.vprev{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.vprev .big2{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.sync{font-size:11px;color:var(--muted);text-align:center;margin:4px 0 14px}
.loading{padding:40px 16px;text-align:center;color:var(--muted)}
</style>
</head>
<body>

<header class="top">
  <h1 id="title">Mis Finanzas</h1>
  <button class="icon-btn" id="btnCfg" aria-label="Ajustes">⚙️</button>
</header>
<main id="view"><div class="loading">Cargando tus finanzas…</div></main>
<nav class="tabs" aria-label="Secciones">
  <button data-tab="inicio">🏠<span>Inicio</span></button>
  <button data-tab="movs">📋<span>Movimientos</span></button>
  <button class="fab" id="fab" aria-label="Registrar movimiento">+</button>
  <button data-tab="analisis">📊<span>Análisis</span></button>
  <button data-tab="presupuestos">🎯<span>Presupuestos</span></button>
</nav>
<div id="sheetWrap" class="sheet-wrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="chart.umd.min.js"></script>
<script src="supabase.js"></script>
<script src="config.js"></script>
<script>
"use strict";
/* =================== Utilidades =================== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const hoy = () => ymd(new Date());
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = n => Math.round((n || 0) * 100) / 100;
const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g, '').replace(/[^0-9.\-]/g, '')); return isFinite(n) ? r2(n) : 0; };
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const sum = (arr, f = x => +x.monto || 0) => arr.reduce((a, x) => a + f(x), 0);
const pct = (v, d = 0) => ((v || 0) * 100).toFixed(d) + '%';
function fmt(n) {
  const v = n || 0;
  try { return new Intl.NumberFormat('es-MX', { style: 'currency', currency: (C().params.moneda || 'MXN'), minimumFractionDigits: 0, maximumFractionDigits: Math.abs(v) >= 1000 ? 0 : 2 }).format(v); }
  catch (e) { return '$' + Math.round(v).toLocaleString('es-MX'); }
}
const ymAdd = (ym, n) => { const [y, m] = ym.split('-').map(Number); return ymd(new Date(y, m - 1 + n, 1)).slice(0, 7); };
const monthEnd = ym => { const [y, m] = ym.split('-').map(Number); return ymd(new Date(y, m, 0)); };
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
const mesNombre = ym => { const [y, m] = ym.split('-').map(Number); return cap1(new Date(y, m - 1, 1).toLocaleDateString('es-MX', { month: 'long', year: 'numeric' }).replace(' de ', ' ')); };
const mesCorto = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('es-MX', { month: 'short', year: '2-digit' }).replace('.', ''); };
const fDate = s => s ? parseD(s).toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }).replace('.', '') : '—';
const fDateY = s => s ? parseD(s).toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' }).replace('.', '') : '—';
function diaNombre(f) {
  if (f === hoy()) return 'Hoy';
  const ay = new Date(); ay.setDate(ay.getDate() - 1); if (f === ymd(ay)) return 'Ayer';
  return cap1(parseD(f).toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'short' }));
}
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* =================== Configuración por defecto =================== */
const CLASES = {
  fijo: { l: 'Fijos', u: 'Fijo', i: '📌', c: 'fix' },
  variable: { l: 'Variables', u: 'Variable', i: '🛒', c: 'var' },
  hormiga: { l: 'Hormiga', u: 'Hormiga', i: '🐜', c: 'ant' }
};
const CLASES_CTA = ['Líquido', 'Meta de ahorro', 'Inversión largo plazo', 'Prestación'];
const MONEDAS = ['MXN', 'USD', 'EUR', 'COP', 'ARS', 'CLP', 'PEN', 'GTQ', 'DOP', 'CRC', 'UYU'];
const UMBRALES = [
  { id: 'endeud', nombre: 'Endeudamiento (pasivos / activos)', sano: .3, riesgo: .5, dir: 'menor', fmt: 'pct' },
  { id: 'deudaIng', nombre: 'Deuda de tarjetas / ingreso anual', sano: .15, riesgo: .3, dir: 'menor', fmt: 'pct' },
  { id: 'intIng', nombre: 'Intereses / ingreso mensual', sano: .03, riesgo: .08, dir: 'menor', fmt: 'pct' },
  { id: 'apal', nombre: 'Apalancamiento (activos / patrimonio)', sano: 1.5, riesgo: 3, dir: 'menor', fmt: 'x' },
  { id: 'liq', nombre: 'Liquidez: meses de gastos fijos cubiertos', sano: 3, riesgo: 1, dir: 'mayor', fmt: 'm' },
  { id: 'ahorro', nombre: 'Tasa de ahorro del mes', sano: .2, riesgo: .1, dir: 'mayor', fmt: 'pct' },
  { id: 'hormiga', nombre: 'Gasto hormiga / ingreso del mes', sano: .05, riesgo: .1, dir: 'menor', fmt: 'pct' }
];
const G = (nombre, clase, presupuesto = 0, recurrente = false) => ({ nombre, tipo: 'Gasto', clase, presupuesto, recurrente });
const DEFAULT_CFG = {
  params: { moneda: 'MXN', tc: 18.5, rentaUSD: 0, ingresoRef: 0, iva: 0.16, pagoDeuda: 0 },
  categorias: [
    { nombre: 'Sueldo', tipo: 'Ingreso' }, { nombre: 'Vales', tipo: 'Ingreso' }, { nombre: 'Aguinaldo', tipo: 'Ingreso' }, { nombre: 'Freelance', tipo: 'Ingreso' }, { nombre: 'Otro ingreso', tipo: 'Ingreso' },
    G('Renta', 'fijo', 0, true), G('Servicios', 'fijo', 0, true), G('Celular', 'fijo', 0, true), G('Suscripciones', 'fijo', 0, true), G('Gym', 'fijo', 0, true),
    G('Súper', 'variable'), G('Restaurante', 'variable'), G('Transporte', 'variable'), G('Ropa', 'variable'), G('Medicinas', 'variable'), G('Regalos', 'variable'), G('Otros', 'variable'),
    G('Café', 'hormiga'), G('Snacks', 'hormiga'), G('Antojos', 'hormiga'), G('Alcohol', 'hormiga'), G('Apps', 'hormiga')

  const start = hoy().slice(0, 7), rows = []; let totInt = 0, ok = true;
  for (let k = 0; k <= 120; k++) {

    let intM = 0; bal.forEach(x => { const i = x.b * x.t / 12 * (1 + iva); x.i = i; x.b += i; intM += i; });
    let avail = pago + (extras[ym] || 0);

    else { bal.forEach((x, i) => { x.b -= mins[i]; pagado += mins[i]; }); avail -= sumMin; [...bal].sort((a, b) => b.t - a.t).forEach(x => { const p = Math.min(x.b, avail); x.b -= p; avail -= p; pagado += p; }); }

    const done = bal.filter(x => x.b < 1 && !x.closed).map(x => { x.closed = true; return x.n; });
    rows.push({ ym, int: intM, pago: pagado, saldo: bal.reduce((a, x) => a + Math.max(0, x.b), 0), done });
    if (k === 0 && pago + (extras[ym] || 0) <= intM) { ok = false; break; }
  }

}

function historia() {

/* ---------- Motivación: dinero real del día 1 y racha con comodines ---------- */
/* Días en que registraste algo (por fecha de captura; datos viejos sin hora usan la fecha del movimiento) */
function diasActivos() {
  const s = new Set();
  [D.movs, D.pas, D.act, D.msi].forEach(l => l.forEach(r => { const c = +r.creado || 0; const d = c > 1e12 ? ymd(new Date(c)) : r.fecha; if (d) s.add(d); }));
  return s;
}
/* Racha que perdona: empiezas con 1 comodín, ganas 1 cada 7 días seguidos (máx. 2).
   Un día sin registrar gasta un comodín en lugar de romper la racha. Hoy no cuenta como falta. */
function racha() {
  const act = diasActivos(), h = hoy(), dias = [...act].filter(d => d <= h).sort();
  if (!dias.length) return { n: 0, comodines: 1, hoy: false, ultimo: null, usado: false };
  let n = 0, com = 1, usado = false;
  const d = parseD(dias[0]), fin = parseD(h), tope = new Date(fin); tope.setDate(tope.getDate() - 400); if (d < tope) d.setTime(tope.getTime());
  for (; d <= fin; d.setDate(d.getDate() + 1)) {
    const k = ymd(d);
    if (act.has(k)) { n++; usado = false; if (n % 7 === 0 && com < 2) com++; }
    else if (k === h) { /* el día de hoy todavía no termina */ }
    else if (n > 0 && com > 0) { com--; usado = true; }
    else { n = 0; com = 1; usado = false; }
  }
  return { n, comodines: com, hoy: act.has(h), ultimo: dias[dias.length - 1], usado };
}

    <h2>🐜 Gastos hormiga</h2>

      ${top.map(([c, v]) => `<div class="row"><div class="ic s-ant">${icono(c)}</div><div class="main"><div class="t">${esc(c)}</div><div class="prog"><i style="width:${(v / R.g.hormiga * 100).toFixed(0)}%;background:var(--ant)"></i></div></div><div class="amt">${fmt(v)}</div></div>`).join('')}`
      : '<div class="muted small">Sin gastos hormiga este mes. Registra cada café, snack o antojo con 🐜.</div>'}
  </section>

  <section class="card">
    <h2>📈 Patrimonio</h2>
    <div class="stats c3">
      <div class="stat s-sav tap" data-go="ahorros"><div class="k">Activos</div><div class="v">${fmt(R.totA)}</div></div>
      <div class="stat s-debt tap" data-go="tarjetas"><div class="k">Deuda tarjetas</div><div class="v">${fmt(R.totP)}</div><div class="s">≈ ${fmt(R.interes)}/mes de interés</div></div>
      <div class="stat ${R.pn < 0 ? 's-debt' : 's-inc'}"><div class="k">Neto</div><div class="v">${fmt(R.pn)}</div></div>
    </div>
  </section>

  <section class="card">
    <h2>🕒 Últimos movimientos ${D.movs.length ? '<button class="btn sm" data-go="movs">Ver todos</button>' : ''}</h2>
    ${ult.length ? ult.map(filaMov).join('') : '<div class="muted small">Toca <b>+</b> para registrar por voz o a mano.</div>'}
  </section>
  <div class="sync" id="syncInfo">${textoSync()}</div>`;
}

/* ---------- Movimientos ---------- */
/* Resumen de lo que estás filtrando: suma del mes, cuántos y qué porcentaje representa */
function resumenFiltro(R, ms) {
  if (filtro === 'todos' || !ms.length) return '';
  const tot = sum(ms), n = ms.length, cuantos = `${n} ${n === 1 ? 'movimiento' : 'movimientos'}`;
  const esActual = mes === hoy().slice(0, 7), dias = esActual ? new Date().getDate() : +monthEnd(mes).slice(8);
  const porCat = {}; ms.forEach(m => porCat[m.cat] = (porCat[m.cat] || 0) + Math.abs(+m.monto || 0));
  const top = Object.entries(porCat).sort((a, b) => b[1] - a[1]).slice(0, 3);
  let titulo, cls, extra = '';
  if (filtro === 'Ingreso') { titulo = '💰 Ingresos del mes'; cls = 's-inc'; }
  else if (filtro === 'Ahorro') {
    titulo = '🐷 Ahorro e inversión del mes'; cls = 's-sav';
    const ap = sum(ms.filter(m => m.monto > 0)), re = -sum(ms.filter(m => m.monto < 0));
    extra = `<div class="small">Aportaste <b class="num">${fmt(ap)}</b>${re ? ` y retiraste <b class="num">${fmt(re)}</b>` : ''}${R.ing ? ` · ${pct(tot / R.ing, 1)} de tus ingresos` : ''}</div>`;
  } else {
    const o = CLASES[filtro]; titulo = `${o.i} Gastos ${o.l.toLowerCase()} del mes`; cls = 's-' + o.c;
    extra = `<div class="small"><b>${R.gas ? pct(tot / R.gas, 1) : '—'}</b> de tus gastos${R.ing ? ` · <b>${pct(tot / R.ing, 1)}</b> de tus ingresos` : ''}${filtro === 'hormiga' ? ` · ${fmt(tot / dias)} al día` : ''}</div>`;
  }
  return `<section class="card ${cls}" style="margin-top:8px">
    <div class="small" style="opacity:.85">${titulo}</div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><div class="amt" style="font-size:26px">${fmt(tot)}</div><div class="small">${cuantos}</div></div>
    ${extra}
    ${top.length > 1 ? `<div class="tiny" style="margin-top:6px;opacity:.85">Más alto: ${top.map(([c, v]) => `${icono(c)} ${esc(c)} ${fmt(v)}`).join(' · ')}</div>` : ''}
  </section>`;
}
function vMovs() {
  const R = calc(mes);
  const pasa = m => filtro === 'todos' || (filtro === 'Ingreso' && m.tipo === 'Ingreso') || (filtro === 'Ahorro' && m.tipo === 'Ahorro') || (m.tipo === 'Gasto' && claseDe(m) === filtro);
  const ms = R.mm.filter(pasa).sort((a, b) => b.fecha.localeCompare(a.fecha) || (b.creado || 0) - (a.creado || 0));
  const grupos = {}; ms.forEach(m => (grupos[m.fecha] = grupos[m.fecha] || []).push(m));
  const chips = [['todos', 'Todos'], ['Ingreso', '💰 Ingresos'], ['fijo', '📌 Fijos'], ['variable', '🛒 Variables'], ['hormiga', '🐜 Hormiga'], ['Ahorro', '🐷 Ahorro']]
    .map(([k, l]) => `<button class="chip ${filtro === k ? 'on' : ''}" data-filtro="${k}">${l}</button>`).join('');
  return `
  <div class="monthnav"><button class="icon-btn" data-mes="-1" aria-label="Mes anterior">‹</button><b>${mesNombre(mes)}</b><button class="icon-btn" data-mes="1" aria-label="Mes siguiente">›</button></div>
  <section class="card">
    <div class="stats">
      <div class="stat s-inc"><div class="k">Ingresos</div><div class="v">${fmt(R.ing)}</div></div>
      <div class="stat s-neu"><div class="k">Gastos</div><div class="v">${fmt(R.gas)}</div></div>
      <div class="stat s-sav"><div class="k">Ahorro</div><div class="v">${fmt(R.aho)}</div></div>
      <div class="stat ${R.libre < 0 ? 's-debt' : 's-inc'}"><div class="k">Disponible</div><div class="v">${fmt(R.libre)}</div></div>
    </div>
    ${R.gas ? `<div class="lbl" style="margin-top:14px">¿Cómo se reparten tus gastos?</div>
    <div class="bar" style="margin-top:0;height:12px">${Object.entries(CLASES).map(([cl]) => `<i style="width:${(R.g[cl] / R.gas * 100).toFixed(1)}%;background:var(--${CLASES[cl].c})"></i>`).join('')}</div>
    <div class="stats c3" style="margin-top:8px">${Object.entries(CLASES).map(([cl, o]) => `<div class="stat s-${o.c} tap" data-filtro="${cl}"><div class="k">${o.i} ${o.l}</div><div class="v">${pct(R.g[cl] / R.gas)}</div><div class="s num">${fmt(R.g[cl])}</div></div>`).join('')}</div>` : ''}
  </section>
  <details class="card" id="dRec" style="padding-block:12px"><summary style="margin:0;font-size:15px;font-weight:600;color:var(--ink)">📅 Gastos recurrentes del mes</summary><div style="margin-top:8px">${recurrentesHtml(mes)}</div></details>
  <div class="chips scroll" style="margin-bottom:6px">${chips}</div>
  ${resumenFiltro(R, ms)}
  ${ms.length ? Object.entries(grupos).map(([f, xs]) => {
    const g = sum(xs.filter(x => x.tipo === 'Gasto'));
    return `<div class="dayhead"><span>${diaNombre(f)}</span><span class="num">${g ? '−' + fmt(g) : ''}</span></div><section class="card" style="padding:4px 16px">${xs.map(filaMov).join('')}</section>`;
  }).join('') : '<div class="empty">Sin movimientos en este mes.</div>'}`;
}

/* ---------- Análisis ---------- */
function vAnalisis() {
  const R = calc(mes), c = C(), H = historia();
  const tile = (k, v, s, cls = '') => `<div class="stat ${cls}"><div class="k">${k}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
  const grupo = cl => {
    const ks = R.cats.filter(k => (k.clase || 'variable') === cl && (k.pres > 0 || k.real > 0));
    if (!ks.length) return '';
    const p = sum(ks, k => k.pres), r = sum(ks, k => k.real);
    return `<div class="lbl"><b style="color:var(--${CLASES[cl].c})">${CLASES[cl].i} ${CLASES[cl].l}</b><span class="num">· ${fmt(r)} de ${fmt(p)}</span></div>` + ks.map(k => {
      const col = !k.pres ? 'var(--muted)' : k.uso > 1 ? 'var(--debt)' : k.uso >= .85 ? 'var(--warn)' : 'var(--' + CLASES[cl].c + ')';
      return `<div class="row first" style="padding:6px 0"><div class="main"><div class="small" style="display:flex;justify-content:space-between;gap:8px"><span class="t">${icono(k.nombre)} ${esc(k.nombre)}</span><span class="num" style="white-space:nowrap"><b>${fmt(k.real)}</b><span class="muted"> / ${k.pres ? fmt(k.pres) : 'sin presupuesto'}</span></span></div>
        <div class="prog"><i style="width:${k.pres ? Math.min(100, k.uso * 100).toFixed(0) : (k.real ? 100 : 0)}%;background:${col}"></i></div></div></div>`;
    }).join('');
  };
  despues.push(() => {
    donut('chClase', ['Fijos', 'Variables', 'Hormiga'], [R.g.fijo, R.g.variable, R.g.hormiga], [css('--fix'), css('--var'), css('--ant')]);
    const top = R.cats.filter(k => k.real > 0).sort((a, b) => b.real - a.real);
    const pal = [css('--pri'), css('--fix'), css('--var'), css('--ant'), css('--sav'), css('--warn'), css('--inc'), css('--debt')];
    donut('chCats', top.slice(0, 7).map(k => k.nombre).concat(top.length > 7 ? ['Resto'] : []), top.slice(0, 7).map(k => k.real).concat(top.length > 7 ? [sum(top.slice(7), k => k.real)] : []), pal);
    linea('chHist', H.map(r => mesCorto(r.ym)), [
      { label: 'Activos', data: H.map(r => r.a), color: css('--sav') },
      { label: 'Deuda', data: H.map(r => r.p), color: css('--debt') },
      { label: 'Patrimonio', data: H.map(r => r.a - r.p), color: css('--ink'), dash: true }]);
    barras('chFlujo', H.slice(-12).map(r => mesCorto(r.ym)), [
      { label: 'Ingresos', data: H.slice(-12).map(r => r.i), color: css('--inc') },
      { label: 'Gastos', data: H.slice(-12).map(r => r.g), color: css('--fix') },
      { label: 'Hormiga', data: H.slice(-12).map(r => r.h), color: css('--ant') }]);
  });
  const ind = c.umbrales.map(u => { const v = R.ind[u.id] ?? 0, e = estado(u, v); return `<div class="row"><div class="main"><div class="small" style="font-weight:600">${esc(u.nombre)}</div><div class="sub">Sano si es ${u.dir === 'menor' ? '≤' : '≥'} ${fmtInd(u.fmt, +u.sano)}</div></div><div class="num" style="text-align:right"><b>${fmtInd(u.fmt, v)}</b><div><span class="badge ${ESTADO[e][1]}">${ESTADO[e][0]}</span></div></div></div>`; }).join('');
  const flujo = [['Ingresos', R.ing], ['📌 Gastos fijos', R.g.fijo], ['🛒 Gastos variables', R.g.variable], ['🐜 Gastos hormiga', R.g.hormiga], ['🐷 Ahorro e inversión', R.aho]];
  return `
  <div class="monthnav"><button class="icon-btn" data-mes="-1" aria-label="Mes anterior">‹</button><b>${mesNombre(mes)}</b><button class="icon-btn" data-mes="1" aria-label="Mes siguiente">›</button></div>
  <section class="card">
    <div class="stats">
      ${tile('Patrimonio neto', fmt(R.pn), 'Activos − deudas', R.pn < 0 ? 's-debt' : 's-inc')}
      ${tile('Tasa de ahorro', pct(R.ind.ahorro, 1), '(Ingreso − gasto) / ingreso', R.ind.ahorro < 0 ? 's-debt' : 's-sav')}
      ${tile('Flujo libre', fmt(R.libre), 'Para deudas o metas', R.libre < 0 ? 's-debt' : 's-neu')}
      ${tile('Interés tarjetas', fmt(R.interes), 'Estimado al mes con IVA', 's-debt')}
    </div>
  </section>
  <section class="card"><h2>🩺 Indicadores de salud financiera</h2>
    ${ind}
    <p class="tiny muted">Puedes cambiar los umbrales en ⚙️ Ajustes. ${+c.params.ingresoRef ? '' : 'Pon tu ingreso mensual de referencia en Ajustes para medir mejor la deuda.'}</p></section>
  <section class="card"><h2>📈 Patrimonio <span class="tiny muted">toca para ver detalle</span></h2>
    <div class="stats c3">
      <div class="stat s-sav tap" data-sub="cuentas"><div class="k">🐷 Cuentas</div><div class="v">${fmt(R.totA)}</div></div>
      <div class="stat s-debt tap" data-sub="tarjetas"><div class="k">💳 Tarjetas</div><div class="v">${fmt(R.totP)}</div></div>
      <div class="stat ${R.pn < 0 ? 's-debt' : 's-inc'}"><div class="k">Neto</div><div class="v">${fmt(R.pn)}</div></div>
    </div>
  </section>
  <section class="card"><h2>🍩 ¿En qué se va tu dinero?</h2>
    ${R.gas ? `<div class="two" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))"><div class="chart sm"><canvas id="chClase" aria-label="Gasto por tipo"></canvas></div><div class="chart sm"><canvas id="chCats" aria-label="Gasto por categoría"></canvas></div></div>` : '<div class="muted small">Sin gastos este mes.</div>'}
  </section>
  <section class="card"><h2>💸 Flujo del mes</h2>
    <div class="scroll-x"><table><tr><th>Concepto</th><th class="r">Monto</th><th class="r">% del ingreso</th></tr>
      ${flujo.map(f => `<tr><td>${f[0]}</td><td class="r num">${fmt(f[1])}</td><td class="r num">${R.ing ? pct(f[1] / R.ing, 1) : '—'}</td></tr>`).join('')}
      <tr class="tot"><td>Disponible</td><td class="r num">${fmt(R.libre)}</td><td class="r num">${R.ing ? pct(R.libre / R.ing, 1) : '—'}</td></tr></table></div>
  </section>
  <section class="card"><h2>📊 Ingresos y gastos por mes</h2><div class="chart"><canvas id="chFlujo" aria-label="Ingresos y gastos por mes"></canvas></div></section>
  <section class="card"><h2>📈 Evolución de tu patrimonio</h2><div class="chart"><canvas id="chHist" aria-label="Evolución del patrimonio"></canvas></div>
    <details id="dHist"><summary>Ver tabla mes a mes</summary><div class="scroll-x"><table><tr><th>Mes</th><th class="r">Activos</th><th class="r">Deuda</th><th class="r">Patrimonio</th><th class="r">Ingresos</th><th class="r">Gastos</th><th class="r">Tasa ahorro</th></tr>
      ${H.slice().reverse().map(r => `<tr><td>${mesCorto(r.ym)}</td><td class="r num">${fmt(r.a)}</td><td class="r num">${fmt(r.p)}</td><td class="r num" style="color:${r.a - r.p < 0 ? 'var(--debt)' : 'inherit'}">${fmt(r.a - r.p)}</td><td class="r num">${fmt(r.i)}</td><td class="r num">${fmt(r.g)}</td><td class="r num">${r.i ? pct((r.i - r.g) / r.i, 1) : '—'}</td></tr>`).join('')}</table></div></details>
  </section>`;
}

/* ---------- Ahorros ---------- */
function vAhorros() {
  const R = calc(hoy().slice(0, 7)), c = C();
  const cuentas = R.ctas.map(a => {
    const inv = a.clase === 'Inversión largo plazo', rd = inv ? rendimiento(a) : null;
    const hist = [...D.act.filter(r => r.cuentaId === a.id).map(r => ({ ...r, k: 'act' })), ...D.movs.filter(m => m.tipo === 'Ahorro' && m.cuentaId === a.id).map(m => ({ ...m, k: 'mov' }))]
      .sort((x, y) => y.fecha.localeCompare(x.fecha) || (y.creado || 0) - (x.creado || 0)).slice(0, 15);
    return `<section class="card">
      <h2><span class="tap" data-editcta="${a.id}">${icono(a.nombre, 'Ahorro')} ${esc(a.nombre)} <span class="muted small">✎</span></span><span class="badge ${inv ? 's-inc' : a.clase === 'Líquido' ? 's-sav' : 's-fix'}">${esc(a.clase)}</span></h2>
      <div class="amt" style="font-size:26px">${fmt(a.saldo)}</div>
      ${rd ? `<div class="small muted">Capital invertido ${fmt(rd.capital)} · Rendimiento <b style="color:${rd.rend < 0 ? 'var(--debt)' : 'var(--inc)'}">${rd.rend >= 0 ? '+' : ''}${fmt(rd.rend)} (${pct(rd.pct, 1)})</b> desde ${fDateY(rd.desde)}</div>` : ''}
      <div class="tiny muted">${pct(a.share)} de tus activos${a.snap ? ' · último saldo registrado ' + fDate(a.snap.fecha) : ''}</div>
      <div class="btns">
        <button class="btn sm" data-ctamov="saldo" data-id="${a.id}">Actualizar saldo (rendimiento o corrección)</button>
      </div>
      ${hist.length ? `<details id="dc-${a.id}"><summary>Historial</summary>${hist.map(h => h.k === 'act'

        : `<div class="row tap" data-edit="${esc(h.id)}"><div class="main"><div class="small">${h.monto < 0 ? '↩ Retiro' : '→ Aportación'}</div><div class="sub">${fDateY(h.fecha)}${h.nota ? ' · ' + esc(h.nota) : ''}</div></div><div class="amt small ${h.monto < 0 ? '' : 'pos'}">${h.monto < 0 ? '−' : '+'}${fmt(Math.abs(h.monto))}</div></div>`).join('')}</details>` : ''}
    </section>`;
  }).join('');
  return `
  <section class="card hero">
    <div class="label">Total en ahorros e inversiones</div>
    <div class="big">${fmt(R.totA)}</div>
    <div class="stats">${CLASES_CTA.filter(k => R.byClase[k]).map(k => `<div class="stat ${k === 'Inversión largo plazo' ? 's-inc' : k === 'Líquido' ? 's-sav' : 's-fix'}"><div class="k">${esc(k)}</div><div class="v">${fmt(R.byClase[k])}</div><div class="s">${R.totA ? pct(R.byClase[k] / R.totA) : ''}</div></div>`).join('')}</div>
    ${R.fijosBase ? `<div class="small muted" style="margin-top:10px">Tu dinero líquido cubre <b style="color:var(--ink)">${R.ind.liq.toFixed(1)} meses</b> de gastos fijos (${fmt(R.fijosBase)}/mes).</div>` : ''}
  </section>
  ${cuentas || '<div class="empty">Agrega tu primera cuenta: ahorro, fondo de emergencia, CETES, GBM, acciones…</div>'}

}

/* ---------- Tarjetas ---------- */
function vTarjetas() {
  const R = calc(hoy().slice(0, 7)), lim = sum(R.cards, t => +t.limite || 0);
  const cards = [...R.cards].sort((a, b) => (a.prio || 99) - (b.prio || 99)).map(t => {
    const uso = +t.limite ? t.saldo / t.limite : null, d = t.due ? diasA(t.due) : null;
    const hist = [...D.pas.filter(r => r.tarjetaId === t.id).map(r => ({ ...r, k: 'pas' })), ...D.movs.filter(m => m.tipo === 'Gasto' && m.pago === t.id).map(m => ({ ...m, k: 'mov' }))]
      .sort((x, y) => y.fecha.localeCompare(x.fecha) || (y.creado || 0) - (x.creado || 0)).slice(0, 20);
    return `<section class="card">
      <h2><span class="tap" data-edittar="${t.id}">💳 ${esc(t.nombre)} <span class="muted small">✎</span></span>
        <span>${t.prio ? `<span class="badge ${t.prio === 1 ? 's-debt' : 's-warn'}">Prioridad ${t.prio}</span>` : '<span class="badge s-inc">Sin deuda</span>'}
        ${d !== null && t.saldo > 0 ? `<span class="badge ${d <= 3 ? 's-debt' : d <= 7 ? 's-warn' : 's-fix'}">Pago ${d === 0 ? 'hoy' : 'en ' + d + ' d'}</span>` : ''}</span></h2>
      <div class="amt" style="font-size:26px;color:${t.saldo > 0 ? 'var(--debt)' : 'var(--ink)'}">${fmt(t.saldo)}</div>
      ${uso !== null ? `<div class="prog"><i style="width:${Math.min(100, uso * 100).toFixed(0)}%;background:${uso > .7 ? 'var(--debt)' : uso > .3 ? 'var(--warn)' : 'var(--inc)'}"></i></div>
        <div class="tiny muted" style="margin-top:4px">Usas ${pct(uso)} de ${fmt(t.limite)} · disponible ${fmt(t.limite - t.saldo)}</div>` : ''}
      ${t.ct && t.saldo > 0 ? `<div class="s-neu" style="border-radius:12px;padding:10px 12px;margin-top:10px">
        ${t.ct.vencido
          ? `<div class="small">Próximo corte <b>${fDate(t.ct.next)}</b>. Para no generar intereses pagarías aprox. <b class="num">${fmt(t.pagar)}</b> antes del <b>${fDate(t.due)}</b>.</div>${t.ct.pendiente > 0 && t.ct.fiable ? `<div class="tiny" style="color:var(--debt);margin-top:4px">Del corte del ${fDate(t.ct.corte)} quedaron ${fmt(t.ct.pendiente)} sin pago registrado. Si ya pagaste, regístralo.</div>` : ''}`
          : `<div class="small">Para no generar intereses: <b class="num" style="font-size:16px">${fmt(t.ct.pendiente)}</b> antes del <b>${fDate(t.ct.due)}</b></div>
             <div class="tiny muted" style="margin-top:2px">Saldo al corte del ${fDate(t.ct.corte)}: ${fmt(t.ct.png)}${t.msiMes ? ` (incluye ${fmt(t.msiMes)} de MSI)` : ''}${t.ct.pagado ? ` · ya pagaste ${fmt(t.ct.pagado)}` : ''}${t.ct.pendiente <= 0 ? ' · ✓ cubierto' : ''}</div>${t.ct.fiable ? '' : '<div class="tiny muted" style="margin-top:2px">* Estimado con tu último saldo registrado.</div>'}`}
        ${t.ct.despues > 0 ? `<div class="tiny muted" style="margin-top:4px">Compras después del corte: ${fmt(t.ct.despues)} → van a tu siguiente pago.</div>` : ''}
      </div>` : ''}
      <div class="small muted" style="margin-top:8px">${t.corte ? `Corte día ${t.corte}` : 'Sin día de corte'}${t.due ? ` · Fecha límite <b style="color:var(--ink)">${fDate(t.due)}</b>` : ''} · Tasa ${pct(+t.tasa || 0, 1)} anual

}

function simRender(R) {
  if (!$('#simTiles')) return;
  if (charts.chSim) { charts.chSim.destroy(); delete charts.chSim; }
  const pago = num($('#simPago').value) || +C().params.pagoDeuda || pagoSugerido();
  const extra = num($('#simExtra').value), em = $('#simMes').value, inv = num($('#simInv').value), now = hoy().slice(0, 7);
  $('#simHint').textContent = `Usando ${fmt(pago)}/mes${!num($('#simPago').value) ? (pagoSugerido() ? ' (sugerido: ingreso de referencia − presupuesto de gastos)' : ' (define tu ingreso de referencia en Ajustes o escribe un pago)') : ''}.`;
  const msiTot = sum(R.cards, c => c.msiMes), pagoRev = Math.max(0, pago - msiTot), cardsRev = R.cards.map(c => ({ ...c, saldo: c.rev }));
  if (msiTot) $('#simHint').textContent += ` De ese pago, ${fmt(msiTot)} se van a mensualidades de MSI; el resto se usa para la deuda con intereses.`;
  const base = simular(cardsRev, pagoRev, {}); const ex = {};
  if (extra > 0 && em) ex[em] = (ex[em] || 0) + extra;
  if (inv > 0) ex[now] = (ex[now] || 0) + inv;
  const hay = Object.keys(ex).length > 0, alt = hay ? simular(cardsRev, pagoRev, ex) : base;
  const t = (k, v, s, good) => `<div class="tile ${good ? 'good' : ''}"><div class="k">${k}</div><div class="v">${v}</div><div class="tiny muted">${s}</div></div>`;
  const fin = s => s.ok ? cap1(mesCorto(s.fin)) : 'No se liquida';
  let h = t('Libre de deudas', fin(base), base.ok ? `${base.rows.length} meses` : 'El pago no cubre los intereses') + t('Intereses a pagar', fmt(base.totInt), 'Hasta liquidar');
  if (hay) {
    h += t('Con el extra', fin(alt), alt.ok ? `${alt.rows.length} meses` : '', true) + t('Te ahorras', fmt(base.totInt - alt.totInt), `${base.rows.length - alt.rows.length > 0 ? (base.rows.length - alt.rows.length) + ' meses antes' : 'misma fecha'}`, true);
    if (inv > 0) h += t('Rendimiento que dejas', fmt(inv * 0.10 / 12 * base.rows.length), 'Supuesto 10% anual');
  }
  $('#simTiles').innerHTML = h;
  const n = Math.max(base.rows.length, alt.rows.length), labels = [...Array(n)].map((_, i) => mesCorto(ymAdd(now, i)));
  const ds = [{ label: 'Plan actual', data: labels.map((_, i) => base.rows[i] ? Math.round(base.rows[i].saldo) : 0), color: css('--debt') }];
  if (hay) ds.push({ label: 'Con el extra', data: labels.map((_, i) => alt.rows[i] ? Math.round(alt.rows[i].saldo) : 0), color: css('--inc') });
  linea('chSim', labels, ds);
  $('#simTabla').innerHTML = `<tr><th>Mes</th><th class="r">Pago</th><th class="r">Intereses</th><th class="r">Deuda al cierre</th><th>Liquidas</th></tr>` +
    alt.rows.map(r => `<tr><td>${mesCorto(r.ym)}</td><td class="r num">${fmt(r.pago)}</td><td class="r num">${fmt(r.int)}</td><td class="r num">${fmt(r.saldo)}</td><td>${r.done.map(esc).join(', ')}</td></tr>`).join('');
}

/* =================== Gráficas =================== */
function baseOpts(extra = {}) {
  return { maintainAspectRatio: false, animation: false, plugins: { legend: { labels: { color: css('--ink'), boxWidth: 12, font: { size: 11 } } }, tooltip: { callbacks: { label: c => `${c.dataset.label || c.label}: ${fmt(c.raw)}` } } }, ...extra };
}
function donut(id, labels, vals, colors) {
  const el = document.getElementById(id); if (!el || !window.Chart) return;
  const tot = vals.reduce((a, b) => a + b, 0);
  charts[id] = new Chart(el, { type: 'doughnut', data: { labels: labels.map((l, i) => `${l} ${tot ? pct(vals[i] / tot) : ''}`), datasets: [{ data: vals, backgroundColor: colors, borderColor: css('--card'), borderWidth: 2 }] },
    options: baseOpts({ cutout: '58%', plugins: { legend: { position: 'bottom', labels: { color: css('--ink'), boxWidth: 10, font: { size: 11 } } }, tooltip: { callbacks: { label: c => `${labels[c.dataIndex]}: ${fmt(c.raw)}` } } } }) });
}
function ejes() { return { y: { ticks: { color: css('--muted'), callback: v => fmt(v) }, grid: { color: css('--line') } }, x: { ticks: { color: css('--muted') }, grid: { display: false } } }; }
function linea(id, labels, sets) {
  const el = document.getElementById(id); if (!el || !window.Chart) return;
  charts[id] = new Chart(el, { type: 'line', data: { labels, datasets: sets.map(s => ({ label: s.label, data: s.data, borderColor: s.color, backgroundColor: s.color, borderDash: s.dash ? [5, 4] : [], tension: .25, pointRadius: labels.length > 12 ? 0 : 3 })) }, options: baseOpts({ scales: ejes() }) });
}
function barras(id, labels, sets) {
  const el = document.getElementById(id); if (!el || !window.Chart) return;
  charts[id] = new Chart(el, { type: 'bar', data: { labels, datasets: sets.map(s => ({ label: s.label, data: s.data, backgroundColor: s.color, borderRadius: 4 })) }, options: baseOpts({ scales: ejes() }) });
}

/* =================== Hojas (sheets) =================== */
function openSheet(html) { $('#sheet').innerHTML = html; $('#sheetWrap').hidden = false; }
function closeSheet() { if (dict && dict.active && dict.active()) dict.stop().catch(() => {}); $('#sheetWrap').hidden = true; $('#sheet').innerHTML = ''; }
$('#sheetWrap').addEventListener('click', e => { if (e.target.id === 'sheetWrap' || e.target.closest('.x')) closeSheet(); });

function recordar(m) {
  const c = JSON.parse(JSON.stringify(C())), l = { ...c.last };
  l.tipo = m.tipo;
  if (m.tipo === 'Gasto') { l['cat_Gasto_' + m.clase] = m.cat; l.catGasto = m.cat; l.pago = m.pago; } else l['cat_' + m.tipo] = m.cat;
  if (JSON.stringify(l) !== JSON.stringify(c.last)) { c.last = l; guardarCfg(c); }
}
function guardarNuevo(m, msg) {
  const id = 'm' + uid(); put('movs/' + id, m); recordar(m);
  toast(msg || `${m.cat} ${fmt(Math.abs(m.monto))} guardado`, () => put('movs/' + id, null));
}

/* ===== Registro: un solo camino (botón +), por voz o a mano ===== */
const TIPOS = { Gasto: '💸 Gasto', Ingreso: '💰 Ingreso', Ahorro: '📈 Ahorro', Pago: '💳 Pago' };
const claseGasto = cat => (C().categorias.find(k => k.nombre === cat) || {}).clase || 'variable';
function modoGuardado() { try { return localStorage.getItem('mf.modo'); } catch (e) { return null; } }
function guardarModo(m) { try { localStorage.setItem('mf.modo', m); } catch (e) {} }
const segModo = actual => `<div class="seg" id="rModo" style="margin-bottom:12px"><button data-modo="voz" class="${actual === 'voz' ? 'on' : ''}">🎙 Por voz</button><button data-modo="manual" class="${actual === 'manual' ? 'on' : ''}">✍️ Manual</button></div>`;
function abrirRegistro() { if ((modoGuardado() || 'voz') === 'voz') openVoz(true); else openMov(); }
function enlazarModo() {
  const s = $('#rModo'); if (!s) return;
  s.onclick = e => { const b = e.target.closest('[data-modo]'); if (!b) return; guardarModo(b.dataset.modo); if (b.dataset.modo === 'voz') openVoz(true); else { if (dict && dict.active()) dict.stop().catch(() => {}); openMov(); } };
}
function guardarRegistro(r, edit) {
  const c = C(), ahora = Date.now();
  if (r.tipo === 'Pago') {
    const t = c.tarjetas.find(x => x.id === r.tarjetaId), id = uid();
    put('pasivos/' + id, { fecha: r.fecha || hoy(), tarjetaId: r.tarjetaId, tipo: 'pago', monto: r.monto, nota: r.nota || '', creado: ahora });
    return toast(`Pago de ${fmt(r.monto)} a ${t ? t.nombre : 'la tarjeta'} registrado`, () => put('pasivos/' + id, null));
  }
  const clase = r.tipo === 'Gasto' ? claseGasto(r.cat) : null;
  if (!edit && r.tipo === 'Gasto' && r.pago && r.msi > 0) {
    const id = 'q' + uid();
    put('msi/' + id, { tarjetaId: r.pago, cat: r.cat, clase, total: r.monto, meses: r.msi, fecha: r.fecha || hoy(), nota: r.nota || '', creado: ahora });
    recordar({ tipo: 'Gasto', cat: r.cat, clase, pago: r.pago });
    return toast(`Compra a ${r.msi} MSI: ${fmt(r.monto / r.msi)} al mes`, () => put('msi/' + id, null));
  }
  const cta = c.cuentas.find(a => a.id === r.cuentaId);
  const m = { fecha: r.fecha || hoy(), tipo: r.tipo, monto: r.tipo === 'Ahorro' && r.retiro ? -r.monto : r.monto, cat: r.tipo === 'Ahorro' ? (cta ? cta.nombre : 'Ahorro') : r.cat, clase,
    nota: r.nota || '', pago: r.tipo === 'Gasto' ? (r.pago || '') : '', cuentaId: r.tipo === 'Ahorro' ? r.cuentaId : '', creado: edit ? (edit.creado || ahora) : ahora };
  if (edit) { put('movs/' + edit.id, m); return toast('Cambios guardados'); }
  guardarNuevo(m, `${m.tipo === 'Ingreso' ? 'Ingreso' : m.tipo === 'Ahorro' ? (r.retiro ? 'Retiro' : 'Aportación') : 'Gasto ' + CLASES[clase].u.toLowerCase()} de ${fmt(r.monto)} guardado`);
}
function faltaEnRegistro(r) {
  const c = C();
  if (!(r.monto > 0)) return 'monto';
  if ((r.tipo === 'Gasto' || r.tipo === 'Ingreso') && !c.categorias.some(k => k.nombre === r.cat && k.tipo === r.tipo)) return 'cat';
  if (r.tipo === 'Ahorro' && !c.cuentas.some(a => a.id === r.cuentaId)) return 'cuenta';
  if (r.tipo === 'Pago' && !c.tarjetas.some(t => t.id === r.tarjetaId)) return 'tarjeta';
  return '';
}

// --- Por voz (o escribiendo una frase) ---
let vOver = {};
function openVoz(escuchar, texto = '') {
  vOver = {};
  openSheet(`<h3>Registrar<button class="x" aria-label="Cerrar">✕</button></h3>${segModo('voz')}
    ${dict ? '<button class="micbig" id="vMic" type="button" aria-label="Dictar">🎙</button>' : ''}
    <div class="tiny muted" id="vEstado" style="text-align:center">${dict ? 'Toca el micrófono y dilo como lo dirías normalmente.' : 'Escribe la frase o usa el micrófono 🎤 de tu teclado.'}</div>
    <div class="tiny muted" style="text-align:center;margin-top:4px">${ejemplosVoz()}</div>
    <textarea id="vText" class="vtext" rows="2" placeholder="Lo que digas aparece aquí; también puedes escribir">${esc(texto)}</textarea>
    <div id="vPrev"></div>
    <div class="btns"><button class="btn" id="vEdit">Corregir a mano</button><button class="btn pri" id="vSave" style="flex:2" disabled>Guardar</button></div>`);
  enlazarModo();
  const tx = $('#vText');
  tx.addEventListener('input', () => { vOver = {}; vistaVoz(); });
  tx.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); guardarVoz(); } });
  $('#vSave').onclick = guardarVoz;
  $('#vEdit').onclick = () => { if (dict && dict.active()) dict.stop().catch(() => {}); const r = registroVoz(); guardarModo('manual'); openMov(r || {}); };
  $('#vPrev').onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.vcat) vOver.cat = b.dataset.vcat; if (b.dataset.vcta) vOver.cuentaId = b.dataset.vcta; if (b.dataset.vtar) vOver.tarjetaId = b.dataset.vtar; vistaVoz(); };
  if (dict) $('#vMic').onclick = toggleDictado;
  vistaVoz();
  if (escuchar && dict) toggleDictado(); else setTimeout(() => { const el = $('#vText'); if (el && !dict) el.focus(); }, 60);
}
function toggleDictado() {
  if (!dict) return;
  if (dict.active()) { dict.stop().catch(() => {}); return; }
  dict.start({ language: 'es' }).catch(err => {
    const code = err && err.code;
    if (code === 'not_granted' || code === 'unavailable') { dict = null; const m = $('#vMic'); if (m) m.remove(); const e = $('#vEstado'); if (e) e.textContent = 'El dictado no está disponible aquí. Escribe o usa el micrófono 🎤 de tu teclado.'; }
  });
}
function registroVoz() { const tx = $('#vText'); if (!tx) return null; const p = parseRegistro(tx.value); return p ? { ...p, ...vOver } : null; }
function vistaVoz() {
  const el = $('#vPrev'), btn = $('#vSave'); if (!el) return;
  const r = registroVoz(); if (!r) { el.innerHTML = ''; btn.disabled = true; return; }
  const c = C(), falta = faltaEnRegistro(r);
  const tj = c.tarjetas.find(t => t.id === (r.tipo === 'Pago' ? r.tarjetaId : r.pago)), cta = c.cuentas.find(a => a.id === r.cuentaId);
  let que = '';
  if (r.tipo === 'Gasto' && r.cat && falta !== 'cat') { const cl = claseGasto(r.cat); que = `${icono(r.cat)} <b>${esc(r.cat)}</b> <span class="badge s-${CLASES[cl].c}">${CLASES[cl].i} ${CLASES[cl].u}</span>`; }
  if (r.tipo === 'Ingreso' && r.cat && falta !== 'cat') que = `${icono(r.cat, 'Ingreso')} <b>${esc(r.cat)}</b>`;
  if (r.tipo === 'Ahorro' && cta) que = `${r.retiro ? '↩ Retiro de' : '→ Aportación a'} <b>${esc(cta.nombre)}</b> <span class="badge ${cta.clase === 'Inversión largo plazo' ? 's-inc' : 's-sav'}">${esc(cta.clase)}</span>`;
  if (r.tipo === 'Pago' && tj) que = `Pago a <b>💳 ${esc(tj.nombre)}</b>`;
  let h = `<div class="vprev"><div class="small muted">${TIPOS[r.tipo]}${r.fecha !== hoy() ? ' · ' + diaNombre(r.fecha) : ' · hoy'}</div>
    <div class="big2">${r.monto > 0 ? fmt(r.monto) : '<span style="font-size:15px;color:var(--debt)">Falta el monto: dilo o escríbelo</span>'}</div>
    <div class="small">${que || `<span style="color:var(--debt)">${{ cat: '¿En qué fue? Elige una opción:', cuenta: '¿A qué cuenta? Elige una:', tarjeta: '¿A qué tarjeta? Elige una:' }[falta] || ''}</span>`}</div>
    ${r.tipo === 'Gasto' ? `<div class="tiny muted" style="margin-top:4px">${tj ? '💳 ' + esc(tj.nombre) : '💵 Efectivo / Débito'}${r.msi ? ` · ${r.msi} MSI de ${fmt(r.monto / r.msi)}` : ''}</div>` : ''}
    ${r.nota ? `<div class="tiny muted">“${esc(r.nota)}”</div>` : ''}</div>`;
  if (falta === 'cat') { const lista = c.categorias.filter(k => k.tipo === r.tipo); h += Object.entries(CLASES).map(([cl, o]) => { const ks = r.tipo === 'Gasto' ? lista.filter(k => (k.clase || 'variable') === cl) : (cl === 'fijo' ? lista : []); return ks.length ? `<div class="lbl">${r.tipo === 'Gasto' ? o.i + ' ' + o.l : ''}</div><div class="chips">${ks.map(k => `<button class="chip" data-vcat="${esc(k.nombre)}">${icono(k.nombre, k.tipo)} ${esc(k.nombre)}</button>`).join('')}</div>` : ''; }).join(''); }
  if (falta === 'cuenta') h += `<div class="chips" style="margin-top:10px">${c.cuentas.map(a => `<button class="chip" data-vcta="${a.id}">${icono(a.nombre, 'Ahorro')} ${esc(a.nombre)}</button>`).join('') || '<span class="small muted">Primero crea una cuenta en Análisis → 🐷 Cuentas.</span>'}</div>`;
  if (falta === 'tarjeta') h += `<div class="chips" style="margin-top:10px">${c.tarjetas.map(t => `<button class="chip" data-vtar="${t.id}">💳 ${esc(t.nombre)}</button>`).join('')}</div>`;
  el.innerHTML = h; btn.disabled = !!falta;
}
function guardarVoz() {
  const r = registroVoz(); if (!r || faltaEnRegistro(r)) return;
  if (dict && dict.active()) dict.stop().catch(() => {});
  closeSheet(); guardarRegistro(r);
}

// --- Manual (y edición de un movimiento) ---
function openMov(o = {}) {
  const c = C(), edit = o.id ? D.movs.find(x => x.id === o.id) : null;
  if (o.id && !edit) return;
  let tipo = edit?.tipo || o.tipo || 'Gasto';
  let cat = edit?.cat || o.cat || null, clasePref = o.clase || null;
  let pago = edit ? (edit.pago || '') : (o.pago ?? (c.last.pago || ''));
  if (pago && !c.tarjetas.some(t => t.id === pago)) pago = '';
  let cuentaId = edit?.cuentaId || o.cuentaId || '';
  let tarjetaId = o.tarjetaId || '';
  let retiro = edit ? edit.monto < 0 : !!o.retiro;
  let msi = edit ? 0 : (+o.msi || 0);
  const montoIni = edit ? Math.abs(edit.monto) : (o.monto ? Math.abs(o.monto) : '');
  const tipos = Object.entries(TIPOS).filter(([k]) => !edit || k !== 'Pago');
  openSheet(`
    <h3>${edit ? 'Editar movimiento' : 'Registrar'}<button class="x" aria-label="Cerrar">✕</button></h3>
    ${edit ? '' : segModo('manual')}
    ${edit ? '' : '<div id="mAtajos"></div>'}
    <div class="seg" id="mSeg" style="margin-top:10px">${tipos.map(([k, l]) => `<button data-t="${k}">${l}</button>`).join('')}</div>
    <input id="mAmt" class="amount-input" inputmode="decimal" placeholder="$0" autocomplete="off" value="${montoIni}">
    <div id="mBody"></div>
    <details id="mDet" ${(edit && (edit.nota || edit.fecha !== hoy())) || (o.fecha && o.fecha !== hoy()) || o.nota ? 'open' : ''}><summary>Fecha y nota (opcional)</summary>
      <div class="two"><label class="field"><span>Fecha</span><input type="date" id="mFecha" value="${edit?.fecha || o.fecha || hoy()}"></label>
      <label class="field"><span>Nota</span><input id="mNota" placeholder="Ej. Starbucks" value="${esc(edit?.nota || o.nota || '')}"></label></div>
    </details>
    <div class="btns">${edit ? '<button class="btn danger" id="mDel">Eliminar</button>' : ''}<button class="btn pri block" id="mSave" style="flex:2">Guardar</button></div>`);
  enlazarModo();
  if (!edit) {
    const ym = hoy().slice(0, 7), favs = favoritos();
    const pend = c.categorias.filter(k => k.tipo === 'Gasto' && k.recurrente && budget(k) && !movsMes(ym).some(m => m.cat === k.nombre && m.tipo === 'Gasto'));
    let h = '';
    if (favs.length) h += `<div class="lbl" style="margin-top:0">⭐ Frecuentes</div><div class="chips scroll">${favs.map((f, i) => `<button class="chip" data-afav="${i}">${icono(f.cat, f.tipo)} ${esc(f.cat)} <b class="num">${fmt(f.monto)}</b></button>`).join('')}</div>`;
    if (pend.length) h += `<div class="lbl">📅 Recurrentes pendientes</div><div class="chips scroll">${pend.map(k => `<button class="chip" data-arec="${esc(k.nombre)}">${icono(k.nombre)} ${esc(k.nombre)} <b class="num">${fmt(budget(k))}</b></button>`).join('')}${pend.length > 1 ? `<button class="chip" data-arecall="1">✅ Todos (${fmt(sum(pend, budget))})</button>` : ''}</div>`;
    $('#mAtajos').innerHTML = h;
    $('#mAtajos').onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.afav !== undefined) { const f = favs[+b.dataset.afav]; tipo = f.tipo; cat = f.cat; pago = f.pago; msi = 0; $('#mAmt').value = f.monto; paint(); }
      else if (b.dataset.arec) { const k = c.categorias.find(x => x.nombre === b.dataset.arec); tipo = 'Gasto'; cat = k.nombre; msi = 0; $('#mAmt').value = budget(k); $('#mNota').value = 'Recurrente'; paint(); }
      else if (b.dataset.arecall) { closeSheet(); registrarRecurrentes(pend.map(k => k.nombre), ym); }
    };
  }
  const paint = () => {
    $$('#mSeg button').forEach(b => b.classList.toggle('on', b.dataset.t === tipo));
    $('#mSave').textContent = tipo === 'Gasto' && pago && msi && !edit ? `Guardar a ${msi} MSI` : tipo === 'Pago' ? 'Registrar pago' : 'Guardar';
    let h = '';
    if (tipo === 'Gasto') {
      const lista = c.categorias.filter(k => k.tipo === 'Gasto');
      if (!cat || !lista.some(k => k.nombre === cat)) {
        let pref = c.last.catGasto;
        if (clasePref) { const lastCl = c.last['cat_Gasto_' + clasePref]; pref = lista.some(k => k.nombre === lastCl && (k.clase || 'variable') === clasePref) ? lastCl : (lista.find(k => (k.clase || 'variable') === clasePref) || {}).nombre; }
        cat = lista.some(k => k.nombre === pref) ? pref : (lista[0] || {}).nombre;
      }
      h = Object.entries(CLASES).map(([cl, o2]) => { const ks = lista.filter(k => (k.clase || 'variable') === cl); return ks.length ? `<div class="lbl" style="color:var(--${o2.c})">${o2.i} ${o2.l}</div><div class="chips">${ks.map(k => `<button class="chip ${k.nombre === cat ? 'on' : ''}" data-cat="${esc(k.nombre)}">${icono(k.nombre)} ${esc(k.nombre)}</button>`).join('')}</div>` : ''; }).join('');
      if (c.tarjetas.length) h += `<div class="lbl">Pagado con</div><div class="chips">${[['', '💵 Efectivo / Débito'], ...c.tarjetas.map(t => [t.id, '💳 ' + t.nombre])].map(([id, l]) => `<button class="chip ${id === pago ? 'on' : ''}" data-pago="${id}">${esc(l)}</button>`).join('')}</div>`;
      if (pago && !edit) h += `<div class="lbl">¿A meses sin intereses?</div><div class="chips">${[0, 3, 6, 9, 12, 18, 24].map(n => `<button class="chip ${n === msi ? 'on' : ''}" data-msi="${n}">${n ? n + ' MSI' : 'No'}</button>`).join('')}</div>${msi ? `<div class="tiny muted" style="margin-top:6px">${num($('#mAmt').value) ? fmt(num($('#mAmt').value) / msi) + ' al mes. ' : ''}Cada mensualidad cuenta como gasto en su mes; el total sube la deuda de la tarjeta sin intereses.</div>` : ''}`;
    } else if (tipo === 'Ingreso') {
      const lista = c.categorias.filter(k => k.tipo === 'Ingreso');
      if (!cat || !lista.some(k => k.nombre === cat)) cat = lista.some(k => k.nombre === c.last.cat_Ingreso) ? c.last.cat_Ingreso : (lista[0] || {}).nombre;
      h = `<div class="chips" style="margin-top:6px">${lista.map(k => `<button class="chip ${k.nombre === cat ? 'on' : ''}" data-cat="${esc(k.nombre)}">${icono(k.nombre, 'Ingreso')} ${esc(k.nombre)}</button>`).join('')}</div>`;
    } else if (tipo === 'Ahorro') {
      if (!c.cuentas.length) h = '<div class="muted small" style="margin-top:8px">Primero crea una cuenta en Análisis → 🐷 Cuentas.</div>';
      else {
        if (!c.cuentas.some(a => a.id === cuentaId)) cuentaId = c.cuentas[0].id;
        h = `<div class="seg" style="margin-top:6px"><button data-r="0" class="${retiro ? '' : 'on'}">→ Aportar / invertir</button><button data-r="1" class="${retiro ? 'on' : ''}">↩ Retirar</button></div>
          <div class="lbl">Cuenta de ahorro o inversión</div><div class="chips">${c.cuentas.map(a => `<button class="chip ${a.id === cuentaId ? 'on' : ''}" data-cta="${a.id}">${icono(a.nombre, 'Ahorro')} ${esc(a.nombre)}</button>`).join('')}</div>`;
      }
    } else {
      if (!c.tarjetas.length) h = '<div class="muted small" style="margin-top:8px">Primero agrega una tarjeta en Análisis → 💳 Tarjetas.</div>';
      else {
        if (!c.tarjetas.some(t => t.id === tarjetaId)) tarjetaId = c.tarjetas[0].id;
        const t = calc(hoy().slice(0, 7)).cards.find(x => x.id === tarjetaId);
        h = `<div class="lbl">¿A qué tarjeta pagaste?</div><div class="chips">${c.tarjetas.map(x => `<button class="chip ${x.id === tarjetaId ? 'on' : ''}" data-tar="${x.id}">💳 ${esc(x.nombre)}</button>`).join('')}</div>
          <div class="small muted" style="margin-top:10px">Deuda ${fmt(t.saldo)} · para no generar intereses <b style="color:var(--ink)">${fmt(t.pagar)}</b>${t.due ? ' antes del ' + fDate(t.due) : ''}</div>
          ${t.pagar > 0 ? `<button class="chip" data-llenar="${t.pagar}" style="margin-top:6px">Usar ${fmt(t.pagar)}</button>` : ''}
          <div class="tiny muted" style="margin-top:6px">El pago baja la deuda; no cuenta como gasto (los gastos ya se contaron al comprar).</div>`;
      }
    }
    $('#mBody').innerHTML = h;
  };
  paint();
  $('#mSeg').onclick = e => { const b = e.target.closest('button'); if (b) { tipo = b.dataset.t; cat = null; clasePref = null; paint(); } };
  $('#mBody').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.cat !== undefined) cat = b.dataset.cat;
    else if (b.dataset.pago !== undefined) { pago = b.dataset.pago; if (!pago) msi = 0; }
    else if (b.dataset.msi !== undefined) msi = +b.dataset.msi;
    else if (b.dataset.cta) cuentaId = b.dataset.cta;
    else if (b.dataset.tar) tarjetaId = b.dataset.tar;
    else if (b.dataset.llenar) $('#mAmt').value = b.dataset.llenar;
    else if (b.dataset.r !== undefined) retiro = b.dataset.r === '1';
    paint();
  };
  const amt = $('#mAmt');

/* =================== Dictado =================== */
function dictadoNavegador() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return null;
  let rec = null, on = false; const h = { f: [], p: [], s: [] };
  const emit = (k, x) => h[k].forEach(fn => { try { fn(x); } catch (e) {} });
  return {
    onFinal: fn => h.f.push(fn), onPartial: fn => h.p.push(fn), onState: fn => h.s.push(fn),
    active: () => on,
    start() {
      return new Promise((ok, no) => {
        rec = new SR(); rec.lang = 'es-MX'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
        rec.onstart = () => { on = true; emit('s', { state: 'listening' }); ok(); };
        rec.onresult = e => {
          let fin = '', par = '';
          for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) fin += r[0].transcript; else par += r[0].transcript; }
          if (par) emit('p', { text: par }); if (fin) emit('f', { text: fin });
        };
        rec.onerror = e => { const code = /not-allowed|service-not-allowed/.test(e.error) ? 'not_granted' : e.error === 'audio-capture' ? 'unavailable' : e.error; if (!on) no({ code }); };
        rec.onend = () => { on = false; emit('s', { state: 'idle', reason: 'stopped' }); };
        try { rec.start(); } catch (e) { no({ code: 'unavailable' }); }
      });
    },
    stop() { try { if (rec && on) rec.stop(); } catch (e) {} return Promise.resolve(); }
  };
}
async function prepararDictado() {
  if (window.claude && claude.use) dict = await claude.use('dictation');
  else dict = dictadoNavegador();
  if (!dict) return;
  pedirRender();
  dict.onFinal(({ text }) => { const el = $('#vText'); if (!el) return; el.value = (el.value.trim() ? el.value.trim() + ' ' : '') + text.trim(); vOver = {}; vistaVoz(); });
  dict.onPartial(({ text }) => { const el = $('#vEstado'); if (el && text) el.textContent = '🎧 ' + text; });
  dict.onState(({ state }) => {
    const mic = $('#vMic'); if (mic) mic.classList.toggle('on', state !== 'idle');
    const e = $('#vEstado'); if (!e) return;
    if (state === 'idle') e.textContent = $('#vText') && $('#vText').value.trim() ? 'Revisa y toca Guardar, o toca el micrófono para agregar algo.' : 'Toca el micrófono y dilo como lo dirías normalmente.';
    else if (!e.textContent.startsWith('🎧')) e.textContent = '🎧 Escuchando…';
  });
}

    if (!Array.isArray(d.movs) || d.version !== 2) { toast('Ese archivo no es un respaldo de esta versión de Mis Finanzas'); return; }
    openSheet(`<h3>Restaurar respaldo<button class="x" aria-label="Cerrar">✕</button></h3>
      <div class="small">El respaldo del ${esc(fDateY(d.fecha || hoy()))} tiene <b>${d.movs.length}</b> movimientos. Tus datos actuales se reemplazarán por los del archivo.</div>
      <div class="btns"><button class="btn" id="rNo">Cancelar</button><button class="btn pri" id="rSi">Reemplazar mis datos</button></div>`);
    $('#rNo').onclick = closeSheet;
    $('#rSi').onclick = () => { closeSheet(); borrador = null; restaurar(d).then(() => { toast('Respaldo restaurado'); irA('inicio'); }); };
    return;
  }
  const pr = e.target.closest('[data-pres]');
  if (pr) { const c = cfgCopia(), k = c.categorias[+pr.dataset.pres]; if (!k) return; const v = num(pr.value); if (v === (+k.presupuesto || 0)) return; k.presupuesto = v; guardarCfg(c); toast(`Presupuesto de ${k.nombre}: ${fmt(v)} al mes`); return; }
  const el = e.target.closest('[data-cfg]'); if (!el || !borrador) return;
  let v = el.type === 'checkbox' ? el.checked : el.value;
  const path = el.dataset.cfg;
  if (path === 'params.ivaPct') { borrador.params.iva = num(v) / 100; return; }
  if (el.getAttribute('inputmode') === 'decimal') v = num(v);
  if (/^categorias\.\d+\.nombre$/.test(path)) { const i = +path.split('.')[1]; const viejo = borrador.categorias[i] && borrador.categorias[i].nombre; if (viejo) borrador._renombres = { ...(borrador._renombres || {}), [viejo]: v }; }
  setPath(borrador, path, v);
  if (/rentaUSD|tc$/.test(path)) rerender();
});
view.addEventListener('click', e => {
  const el = e.target.closest('button,[data-edit],[data-go],[data-sub],[data-filtro],[data-edittar],[data-editcta],[data-editmeta]');
  if (!el) return;
  const d = el.dataset;
  if (d.edit && d.edit.startsWith('msi:')) return editMSI(d.edit.split(':')[1]);
  if (d.edit) return openMov({ id: d.edit });
  if (d.editmsi) return editMSI(d.editmsi);
  if (d.go) return irA(d.go);
  if (d.sub) { subA = d.sub; return irA('analisis'); }
  if (d.filtro) { filtro = d.filtro; return rerender(); }
  if (d.mes) { mes = ymAdd(mes, +d.mes); return rerender(); }
  if (d.tarpago) return pagoTarjeta(d.tarpago);
  if (d.tarsaldo) return saldoCorte(d.tarsaldo);
  if (d.edittar) return editTarjeta(d.edittar);
  if (d.editcta) return editCuenta(d.editcta);
  if (d.ctamov) return movCuenta(d.id, d.ctamov);
  if (d.editmeta) return editMeta(d.editmeta);
  if (d.delreg) { if (!el.classList.contains('armed')) { el.classList.add('armed'); el.textContent = '¿Borrar?'; setTimeout(() => { el.classList.remove('armed'); el.textContent = '✕'; }, 3000); return; } return put(d.delreg, null); }
  if (el.id === 'addTar') return editTarjeta();
  if (el.id === 'addCta') return editCuenta();
  if (el.id === 'addMeta') return editMeta();
  // Ajustes
  if (d.addcat && borrador) { borrador.categorias.push(d.addcat === 'Gasto' ? { nombre: 'Nueva categoría', tipo: 'Gasto', clase: 'variable', presupuesto: 0, recurrente: false } : { nombre: 'Nuevo ingreso', tipo: 'Ingreso' }); return rerender(); }
  if (d.rmcat && borrador) { borrador.categorias.splice(+d.rmcat, 1); return rerender(); }
  if (el.id === 'cfgCancel') { borrador = null; return irA('inicio'); }
  if (el.id === 'cfgSave') {
    const nombres = borrador.categorias.map(k => norm(k.nombre));
    if (nombres.some((n, i) => !n || nombres.indexOf(n) !== i)) { toast('Hay categorías vacías o repetidas'); return; }
    const ren = borrador._renombres || {}; delete borrador._renombres;
    // si renombraste una categoría, sus movimientos la siguen
    for (const [viejo, nuevo] of Object.entries(ren)) if (viejo && nuevo && viejo !== nuevo && !borrador.categorias.some(k => k.nombre === viejo)) D.movs.filter(m => m.cat === viejo && m.tipo !== 'Ahorro').forEach(m => put('movs/' + m.id, { ...m, cat: nuevo }));
    borrador.categorias.forEach(k => { if (k.tipo === 'Gasto') k.clase = k.clase || 'variable'; });
    guardarCfg(borrador); borrador = null; toast('Ajustes guardados'); return irA('inicio');
  }
  if (el.id === 'cExcel') { el.disabled = true; el.textContent = 'Preparando…'; excel().catch(() => toast('No se pudo generar el Excel')).finally(() => { el.disabled = false; el.textContent = '📗 Descargar Excel'; }); return; }
  if (el.id === 'cJson') return descargar(`mis-finanzas-respaldo-${hoy()}.json`, new Blob([JSON.stringify(respaldo(), null, 2)], { type: 'application/json' }));
  if (el.id === 'cImp') return $('#cFile').click();
  if (el.id === 'cDel') {
    if (!el.classList.contains('armed')) { el.classList.add('armed'); el.textContent = '¿Borrar TODO? Toca otra vez'; setTimeout(() => { el.classList.remove('armed'); el.textContent = 'Borrar todos mis datos'; }, 3500); return; }
    borrador = null; restaurar({ config: null }).then(() => { toast('Datos borrados'); irA('inicio'); }); return;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.pres !== undefined) { e.preventDefault(); e.target.blur(); return; }
  if (e.key === 'Escape' && !$('#sheetWrap').hidden) closeSheet();
  if (e.key.toLowerCase() === 'n' && $('#sheetWrap').hidden && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); abrirRegistro(); }
});
window.addEventListener('storage', e => { if (ST.modo === 'local' && e.key === LKEY) { cargarLocal(); refrescar(); } });

/* =================== Arranque =================== */
(function () { const t = location.hash.slice(1); if (TITULOS[t]) tab = t; else if (['cuentas', 'tarjetas', 'ahorros'].includes(t)) { tab = 'analisis'; subA = t === 'tarjetas' ? 'tarjetas' : 'cuentas'; } })();
iniciar().catch(() => { ST.cargado = true; refrescar(); });
prepararDictado().catch(() => {});
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (window.claude && claude.use) claude.use('downloads').then(d => { descargas = d; }).catch(() => {});
</script>
